services:
  # https://github.com/confluentinc/schema-registry
  confluent-schema-registry:
    #image: confluentinc/cp-schema-registry:3.2.1
    image: confluentinc/cp-schema-registry:7.2.15
    network_mode: host
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181/kafka
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8077
      # please replace this setting by the IP of your web tools server
      SCHEMA_REGISTRY_HOST_NAME: "LogStash"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: always

  # https://github.com/confluentinc/kafka-rest
  confluent-rest-proxy:
    #image: confluentinc/cp-kafka-rest:3.2.1
    image: confluentinc/cp-kafka-rest:7.2.15
    network_mode: host
    environment:
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_REST_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181/kafka
      KAFKA_REST_LISTENERS: http://0.0.0.0:8078/
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://LogStash:8077/
      # please replace this setting by the IP of your web tools server
      KAFKA_REST_HOST_NAME: "AWS-Kafka-REST"
    depends_on:
      - confluent-schema-registry
    ulimits:
      nofile:
       soft: 65535
       hard: 65535
    restart: always

  # https://github.com/Landoop/kafka-topics-ui
  kafka-topics-ui:
    #image: landoop/kafka-topics-ui:0.9.2
    image: landoop/kafka-topics-ui:0.9.4
    network_mode: host
    environment:
      KAFKA_REST_PROXY_URL: http://LogStash:8078
      PROXY: "TRUE"
    depends_on:
      - confluent-rest-proxy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: always
